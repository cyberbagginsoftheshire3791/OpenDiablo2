# The green gate, run by GitHub on every push and pull request.
#
# Mirrors the command in CLAUDE.md (gofmt · go vet · go build · go test),
# compiles and vets the `harness` and `playtest` tagged sources WITHOUT
# running either (Article V: no script, no harness binary, ever, on CI),
# and adds the Article V check: every tracked file with a Diablo II
# extension must be in docs/fixtures-allowlist.txt. Linux needs the
# ebitengine system headers (cgo + X11/GL/ALSA) to *compile* the ebiten
# packages, but no display to *test*. That no tested package links ebiten's UI
# is an INVARIANT THIS FILE CHECKS, not a standing fact it may assert: it was
# asserted here as a fact and broke anyway (BUG-13, 19 Sep 2026 -- d2app gained
# its first test file and the Ubuntu runner panicked on DISPLAY before a single
# assertion, while the laptop gate, which has a screen, went green). The
# headless-safe-tests step below reads the import graph and fails; scripts\gate.ps1
# lines 39-66 run the same check locally.
# Windows needs nothing and is the platform the first friends build targets.
name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the laptop's Go (1.27.0) rather than floating on `stable`,
          # so CI and the machine that ships friends build #1 compile with one
          # toolchain (ruled 14 Sep 2026). go.mod's directive stays 1.25.0 (the
          # dep-graph minimum); this is >= that.
          go-version: "1.27.0"
          cache: true

      - name: ebitengine build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # THE TAGGED SOURCES ARE COMPILED AND VETTED, NEVER RUN. Until this step
      # existed CI compiled neither build tag, so the harness server and every
      # playtest script could stop compiling and the gate stayed green.
      #
      # ARTICLE V IS WHY THESE ARE BUILD AND VET ONLY. The playtest scripts
      # launch the real game and need the Diablo II MPQs, which are not on CI
      # and never will be. Nothing here may run a script or a harness binary:
      # `go test -tags playtest` is FORBIDDEN on CI. Compiling is the whole
      # value, and it is free.
      - name: go build (harness tag)
        run: go build -tags harness ./...

      - name: go vet (harness + playtest tags)
        run: go vet -tags "harness playtest" ./...

      # BUG-13, ASSERTED RATHER THAN TRIPPED OVER. A test file in a package whose
      # import graph reaches ebiten's UI panics here on DISPLAY before it asserts
      # anything, and the dev laptop's gate cannot see that because it has a
      # screen. CI caught the original the only way it could -- by crashing, in a
      # step whose name says "go test", which is a bad error message for a
      # structural fault. This reads the graph and names the offending package.
      # Linux only: the check is about the runner without a display.
      - name: headless-safe tests (BUG-13 general case)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tested=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          if [ -z "$tested" ]; then
            echo "RED -- go list returned no tested packages; the check did not run"
            exit 1
          fi
          unsafe=""
          for pkg in $tested; do
            if go list -deps -test "$pkg" | grep -qx 'github.com/hajimehoshi/ebiten/v2/internal/ui'; then
              unsafe="$unsafe $pkg"
            fi
          done
          if [ -n "$unsafe" ]; then
            echo "RED -- has tests AND links ebiten/internal/ui:$unsafe"
            exit 1
          fi
          echo "ok ($(echo "$tested" | wc -l) tested package(s), 0 link ebiten/internal/ui)"

      - name: go test
        run: go test ./...

      # The race detector has never run against this tree, and the process runs
      # several goroutines that never touch the MPQs: the MCP HTTP server, the
      # in-process TCP game server (127.0.0.1:6669) and the audio backend
      # (ruled 14 Sep 2026). No MPQs needed -- no test imports ebiten, so no
      # GLFW init -- and -race needs cgo, which both runners have. It could not
      # be run on the dev laptop (no C toolchain), so CI is its first run.
      - name: go test -race
        run: go test -race ./...

      - name: Article V — tracked fixtures match the allowlist
        run: go run ./tools/strigoihook check-fixtures

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: third-party notices are current
        run: go run ./tools/notices -check
