# The green gate, run by GitHub on every push and pull request.
#
# Mirrors the command in CLAUDE.md (gofmt · go vet · go build · go test),
# compiles and vets the `harness` and `playtest` tagged sources WITHOUT
# running either (Article V: no script, no harness binary, ever, on CI),
# and adds the Article V check: every tracked file with a Diablo II
# extension must be in docs/fixtures-allowlist.txt. Linux needs the
# ebitengine system headers (cgo + X11/GL/ALSA) to *compile* the ebiten
# packages, but no display to *test*: no package that has tests imports
# ebiten (the GlyphPrinter debug printer lives in d2core/d2render/ebiten,
# which has no test files), so the test binaries never initialise GLFW.
# Windows needs nothing and is the platform the first friends build targets.
name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the laptop's Go (1.27.0) rather than floating on `stable`,
          # so CI and the machine that ships friends build #1 compile with one
          # toolchain (ruled 14 Sep 2026). go.mod's directive stays 1.25.0 (the
          # dep-graph minimum); this is >= that.
          go-version: "1.27.0"
          cache: true

      - name: ebitengine build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # THE TAGGED SOURCES ARE COMPILED AND VETTED, NEVER RUN. Until this step
      # existed CI compiled neither build tag, so the harness server and every
      # playtest script could stop compiling and the gate stayed green.
      #
      # ARTICLE V IS WHY THESE ARE BUILD AND VET ONLY. The playtest scripts
      # launch the real game and need the Diablo II MPQs, which are not on CI
      # and never will be. Nothing here may run a script or a harness binary:
      # `go test -tags playtest` is FORBIDDEN on CI. Compiling is the whole
      # value, and it is free.
      - name: go build (harness tag)
        run: go build -tags harness ./...

      - name: go vet (harness + playtest tags)
        run: go vet -tags "harness playtest" ./...

      - name: go test
        run: go test ./...

      # The race detector has never run against this tree, and the process runs
      # several goroutines that never touch the MPQs: the MCP HTTP server, the
      # in-process TCP game server (127.0.0.1:6669) and the audio backend
      # (ruled 14 Sep 2026). No MPQs needed -- no test imports ebiten, so no
      # GLFW init -- and -race needs cgo, which both runners have. It could not
      # be run on the dev laptop (no C toolchain), so CI is its first run.
      - name: go test -race
        run: go test -race ./...

      - name: Article V — tracked fixtures match the allowlist
        run: go run ./tools/strigoihook check-fixtures

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
